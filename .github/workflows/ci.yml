name: Test and build all platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Build and load (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin_amd64
            os: darwin
            arch: amd64
            extension: dylib
            runner: macos-15-intel
          - target: darwin_arm64
            os: darwin
            arch: arm64
            extension: dylib
            runner: macos-15
          - target: linux_amd64
            os: linux
            arch: amd64
            extension: so
            runner: ubuntu-24.04
          - target: linux_arm64
            os: linux
            arch: arm64
            extension: so
            runner: ubuntu-24.04-arm
          - target: windows_amd64
            os: windows
            arch: amd64
            extension: dll
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test source
        run: |
          go test -race ./...
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Set up pinned Linux glibc cross compiler
        if: matrix.os == 'linux'
        run: sh scripts/setup_zig.sh
      - name: Build the native library
        run: sh scripts/build.sh '${{ matrix.os }}' '${{ matrix.arch }}'
      - name: Load and exercise the native library
        run: python tests/abi_smoke.py 'dist/${{ matrix.target }}/cpa-window-starter.${{ matrix.extension }}' --work-dir .build/abi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  package:
    name: Package all five platforms
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Package and validate the complete release
        run: |
          python scripts/package.py
          python - <<'PYTHON'
          import pathlib, re, sys
          sys.path.insert(0, 'scripts')
          from release_platforms import PLATFORMS
          from verify_release import verify
          version = re.search(r'const Version = "([^"]+)"', pathlib.Path('internal/starter/config.go').read_text())[1]
          for target in PLATFORMS:
              print(verify(pathlib.Path('release'), 'v' + version, target))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 14
