name: Verify published packages on all platforms
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.2.7
permissions:
  contents: read
jobs:
  verify:
    name: Download and load (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin_amd64
            os: darwin
            arch: amd64
            extension: dylib
            runner: macos-15-intel
          - target: darwin_arm64
            os: darwin
            arch: arm64
            extension: dylib
            runner: macos-15
          - target: linux_amd64
            os: linux
            arch: amd64
            extension: so
            runner: ubuntu-24.04
          - target: linux_arm64
            os: linux
            arch: arm64
            extension: so
            runner: ubuntu-24.04-arm
          - target: windows_amd64
            os: windows
            arch: amd64
            extension: dll
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download and verify the published archive
        run: |
          mkdir -p .build/release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .build/release --pattern '*_${{ matrix.target }}.zip' --pattern checksums.txt
          python scripts/verify_release.py --directory .build/release --tag "$RELEASE_TAG" --target '${{ matrix.target }}' --extract-to .build/library
      - name: Exercise the actual release library with fake host callbacks
        run: python tests/abi_smoke.py '.build/library/cpa-window-starter.${{ matrix.extension }}' --work-dir .build/abi
