name: Verify published Linux package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.2.6
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Download and verify the published archive
        run: |
          mkdir -p .build/release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .build/release --pattern '*_linux_amd64.zip' --pattern checksums.txt
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, re, zipfile
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+(?:\.[0-9]+)+', tag), 'Invalid release tag'
          root = pathlib.Path('.build/release')
          name = f'cpa-window-starter_{tag[1:]}_linux_amd64.zip'
          entries = {line.split()[1]: line.split()[0] for line in (root/'checksums.txt').read_text().splitlines()}
          assert hashlib.sha256((root/name).read_bytes()).hexdigest() == entries[name], 'Checksum mismatch'
          with zipfile.ZipFile(root/name) as bundle:
              assert bundle.namelist() == ['cpa-window-starter.so'], 'Unexpected archive layout'
              bundle.extractall(root)
          print('Published Linux ZIP structure and SHA-256 verified')
          PYTHON
      - name: Exercise the actual release library with fake host callbacks
        run: python3 tests/abi_smoke.py .build/release/cpa-window-starter.so --work-dir .build/abi
